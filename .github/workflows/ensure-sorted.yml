name: Ensure lists are sorted

on:
  pull_request:

concurrency:
  group: ${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Ensure Sorted Order
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
      checks: write

    env:
      # Fork PRs get a read-only GITHUB_TOKEN, so they can only be checked, not fixed.
      IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'

      - name: Get changed txt files
        id: changed_files
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED_TXT=$(git diff --name-only "$BASE_REF"...HEAD -- '*.txt' | tr '\n' ' ')
          echo "files=$CHANGED_TXT" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED_TXT" ]; then
            echo "No .txt files changed in this PR"
          else
            echo "Changed .txt files: $CHANGED_TXT"
          fi

      - name: Sort changed files
        if: steps.changed_files.outputs.files != '' && env.IS_FORK == 'false'
        env:
          FILES: ${{ steps.changed_files.outputs.files }}
        run: |
          # shellcheck disable=SC2086
          python ./scripts/sorter.py $FILES

      - name: Commit sorted files
        if: steps.changed_files.outputs.files != '' && env.IS_FORK == 'false'
        env:
          FILES: ${{ steps.changed_files.outputs.files }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # shellcheck disable=SC2086
          if git diff --quiet -- $FILES; then
            echo "All changed files already sorted"
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          git add -- $FILES
          git commit -m "Sort list files"
          git push origin "HEAD:$HEAD_REF"
          echo "::notice::Sorted and pushed: $(git diff --name-only HEAD~1 HEAD | tr '\n' ' ')"

      - name: Check file sort order
        if: steps.changed_files.outputs.files != '' && env.IS_FORK == 'true'
        env:
          FILES: ${{ steps.changed_files.outputs.files }}
        run: |
          # shellcheck disable=SC2086
          python ./scripts/sorter.py --check $FILES
